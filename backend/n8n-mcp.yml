name: aria-n8n-mcp

services:
  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    container_name: n8n-mcp
    ports:
      - "4244:4244"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_MODE: http
      PORT: 4244
      HOST: 0.0.0.0
      AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-token}
      N8N_API_URL: ${N8N_API_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      LOG_LEVEL: info
      SESSION_TIMEOUT_MINUTES: 1
      N8N_MCP_MAX_SESSIONS: 10000
      AUTH_RATE_LIMIT_MAX: 100000
      AUTH_RATE_LIMIT_WINDOW: 60000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4244/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
