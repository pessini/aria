name: UI Smoke

on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui-smoke.yml'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-smoke.yml'
      - 'Makefile'

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
